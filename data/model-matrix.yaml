# Task class -> per-provider model/effort: the single source of truth for the spec key `class:`
# and for the built-in equivalents table. src/core/model-matrix.ts is generated from this file
# by `npm run gen:matrix` (scripts/gen-model-matrix.ts); tests/model-matrix.test.ts fails when
# the generated constants and this file disagree.
#
# A cell is "model/effort". `none` means the provider has no model for the class (a spec with
# that class and agent is an error). `explicit: true` classes dispatch restricted models
# (k3.1-pro*, gpt-6-astra): naming the class in a spec IS the explicit request, and the class
# never contributes a row to the default equivalents table.
version: 1
classes:
  report:
    codex: gpt-6-luna/medium
    claude: claude-haiku-5-5/low
    kimi: k3-256k/low
  simple:
    codex: gpt-6-luna/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3-256k/low
  smoke:
    codex: gpt-6-luna/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3/high
  feature:
    codex: gpt-6.1-sol/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3/high
  bugfix:
    codex: gpt-6.1-sol/medium
    claude: claude-sonnet-5-5/high
    kimi: k3/high
  review:
    codex: gpt-6.1-sol/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3/high
  merge:
    codex: gpt-6.1-sol/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3/high
  hard:
    codex: gpt-6.1-sol/high
    claude: claude-opus-5-5/high
    kimi: k3/max
  sim:
    codex: gpt-6.1-sol/high
    claude: claude-opus-5-5/high
    kimi: k3/max
  visual:
    explicit: true
    codex: gpt-6.1-sol/high
    claude: claude-sonnet-5-5/high
    kimi: k3.1-pro/high
  visual-compare:
    codex: gpt-6.1-sol/medium
    claude: claude-sonnet-5-5/medium
    kimi: k3/high
  design:
    codex: gpt-6.1-sol/medium
    claude: claude-opus-5-5/medium
    kimi: k3/high
  creative:
    codex: gpt-6.1-sol/medium
    claude: claude-opus-5-5/medium
    kimi: none
  escalate:
    explicit: true
    codex: gpt-6-astra/high
