name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '26.13.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs
      - run: npm run docs:mermaid
      - run: npm run typecheck
      - name: Test with isolated user directories
        env:
          HOME: ${{ runner.temp }}/agentctl-test/home
          AGENTCTL_HOME: ${{ runner.temp }}/agentctl-test/agentctl
          CODEX_HOME: ${{ runner.temp }}/agentctl-test/codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/agentctl-test/claude
          AGENTCTL_LIVE_CACHE: ${{ runner.temp }}/agentctl-live
          AGENTCTL_TEST_TMP: ${{ runner.temp }}/agentctl-test/tmp
          TMPDIR: ${{ runner.temp }}/agentctl-test/tmp
        run: |
          mkdir -p "$HOME" "$AGENTCTL_HOME" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR" "$TMPDIR"
          npm test
      - run: npm run build
      - run: npm pack --dry-run
